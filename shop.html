<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Shop - All Artworks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
            <a href="index.html" class="text-2xl font-bold text-stone-800 uppercase tracking-widest">INDIA<span class="text-amber-600">ART</span></a>
            <div class="hidden md:flex space-x-6 text-sm">
                <a href="index.html" class="hover:text-amber-600">Home</a>
                <a href="shop.html" class="text-amber-600 font-semibold">Shop All</a>
            </div>
            <div class="flex space-x-4">
                <a href="#" class="text-gray-600"><i class="fa-solid fa-cart-shopping"></i></a>
            </div>
        </div>
    </nav>

    <!-- Shop Layout -->
    <div class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row gap-8">
        <!-- Sidebar / Filters -->
        <div class="w-full md:w-1/4 bg-white p-4 rounded shadow-sm h-fit">
            <h3 class="font-bold text-lg mb-4 border-b pb-2">Categories</h3>
            <ul class="space-y-2 text-sm text-gray-600">
                <li><input type="checkbox" class="mr-2"> Canvas Paintings</li>
                <li><input type="checkbox" class="mr-2"> Pichwai Art</li>
                <li><input type="checkbox" class="mr-2"> Wall Clocks</li>
                <li><input type="checkbox" class="mr-2"> Abstract Art</li>
            </ul>
        </div>

        <!-- Product Grid -->
        <div class="w-full md:w-3/4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Product Item -->
            <a href="product.html" class="bg-white rounded shadow-sm hover:shadow-md transition">
                <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=400&q=80" class="w-full h-64 object-cover">
                <div class="p-4">
                    <h3 class="text-sm font-medium text-gray-800 truncate">Radha Krishna Canvas</h3>
                    <p class="text-amber-600 font-bold mt-1">₹1,999</p>
                </div>
            </a>
            <a href="product.html" class="bg-white rounded shadow-sm hover:shadow-md transition">
                <img src="https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?auto=format&fit=crop&w=400&q=80" class="w-full h-64 object-cover">
                <div class="p-4">
                    <h3 class="text-sm font-medium text-gray-800 truncate">Golden Leaf Abstract</h3>
                    <p class="text-amber-600 font-bold mt-1">₹2,499</p>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
