<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bimba Style - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
            <a href="index.html" class="text-2xl font-bold text-stone-800 uppercase tracking-widest">INDIA<span class="text-amber-600">ARTS</span></a>
            <div class="hidden md:flex space-x-6 text-sm">
                <a href="index.html" class="text-amber-600 font-semibold">Home</a>
                <a href="shop.html" class="hover:text-amber-600">Shop All</a>
                <a href="#" class="hover:text-amber-600">Canvas</a>
                <a href="#" class="hover:text-amber-600">Pichwai</a>
            </div>
            <div class="flex space-x-4">
                <a href="#" class="text-gray-600"><i class="fa-solid fa-magnifying-glass"></i></a>
                <a href="#" class="text-gray-600"><i class="fa-solid fa-cart-shopping"></i></a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="bg-stone-100 py-16 text-center">
        <h1 class="text-4xl md:text-5xl font-serif text-gray-900 mb-4">Indian Traditional Art for Modern Homes</h1>
        <p class="text-gray-600 mb-8 max-w-2xl mx-auto">Bring your walls to life with handcrafted paintings and premium canvas work.</p>
        <a href="shop.html" class="bg-stone-800 text-white px-8 py-3 rounded hover:bg-amber-600 transition">Shop Now</a>
    </section>

    <!-- Featured Products -->
    <section class="max-w-7xl mx-auto px-4 py-12">
        <h2 class="text-2xl font-serif text-center mb-8">Best Sellers</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- Product Card -->
            <a href="product.html" class="block bg-white rounded shadow-sm hover:shadow-md transition">
                <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=400&q=80" class="w-full h-64 object-cover">
                <div class="p-4 text-center">
                    <h3 class="text-sm font-medium text-gray-800">Radha Krishna Canvas</h3>
                    <p class="text-amber-600 font-bold mt-1">₹1,999</p>
                </div>
            </a>
            <!-- Duplicate for demo -->
             <a href="product.html" class="block bg-white rounded shadow-sm hover:shadow-md transition">
                <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=400&q=80" class="w-full h-64 object-cover">
                <div class="p-4 text-center">
                    <h3 class="text-sm font-medium text-gray-800">Abstract Floral Art</h3>
                    <p class="text-amber-600 font-bold mt-1">₹1,499</p>
                </div>
            </a>
        </div>
    </section>

</body>
</html>
